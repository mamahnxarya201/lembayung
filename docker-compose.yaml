services:
  web:
    image: docker.io/library/odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./container-data/odoo-web-data:/var/lib/odoo:Z
      - ./container-data/config:/etc/odoo:Z
      - ./addons:/mnt/extra-addons:Z            # repo-level, git-tracked
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-admin}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_DEV: "${ODOO_DEV:-}"                 # empty = normal, all/xml,qweb = dev
    # Dev SMTP: every outgoing email is captured by Mailpit instead of failing
    # against localhost:25. The first argument must stay `odoo` so the
    # entrypoint still injects the database arguments (CPM-HANDOFF.md 1.3).
    command: ["odoo", "--smtp=mail", "--smtp-port=1025"]
  mail:
    # Mailpit: SMTP catcher with a web UI. Captured mail is in memory, so it
    # is cleared by `podman-compose down`; that is fine for dev and demos.
    image: docker.io/axllent/mailpit:v1.31
    ports:
      - "8025:8025"                             # web UI
      - "1025:1025"                             # SMTP, for host-side test senders
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./container-data/odoo-db-data:/var/lib/postgresql/data/pgdata:Z
